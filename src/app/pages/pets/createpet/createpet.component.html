<div class="container">
  <div class="content">
    <div class="menu">
      <a routerLink="/pets/create#mascota" (click)="setActiveLink('#mascota')">
        <div class="circle" [ngClass]="{'active': isActive('#mascota')}"></div>
        <p class="menu-text">Datos de la mascota</p>
      </a>
      <div class="line"></div>
      <a routerLink="/pets/create#propietario" (click)="setActiveLink('#propietario')">
        <div class="circle" [ngClass]="{'active': isActive('#propietario')}"></div>
        <p class="menu-text">Datos del responsable</p>
      </a>
      <div class="line"></div>
      <a routerLink="/pets/create#contacto" (click)="setActiveLink('#contacto')">
        <div class="circle" [ngClass]="{'active': isActive('#contacto')}"></div>
        <p class="menu-text">Datos adicionales</p>
      </a>
    </div>
    <form class="items-wrapper" (submit)="onSubmit()" novalidate>
      <div class="items" style="height: max-content; height: min-content;" id="mascota" *ngIf="isActive('#mascota')" [@fadeInOut]>
        <div class="img-container" (click)="$event.stopPropagation()">
          <img [src]="imageUrl" alt="Preview">
          <input class="fileImg" type="file" (change)="onFileSelected($event)">
        </div>
        <div class="pet-information">
          <div class="pet-item">
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Nombre</label>
                  <input type="text" id="name" required [value]="inputValue('name')" (keyup)="keyup($event, 'name')">
                </div>
                <div class="input-group">
                  <label for="input2">Tipo</label>
                  <div class="options">
                    <button *ngFor="let type of types" class="option" [class.selected]="isSelected('type', type)" (click)="selectOption('name', type, 'type')">{{ type['name'] }}</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Edad</label>
                  <input type="number" id="age" min="0" required [value]="inputValue('age')" (keyup)="keyup($event, 'age')">
                </div>
                <div class="input-group">
                  <label for="input2">Sexo</label>
                  <div class="options">
                    <button *ngFor="let item of sex" class="option" [class.selected]="isSelected('sex', item)" (click)="selectOption('name', item, 'sex')">{{ item['name'] }}</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Raza</label>
                  <input type="text" id="breed" min="0" required [value]="inputValue('breed')" (keyup)="keyup($event, 'breed')">
                </div>
                <div class="input-group">
                  <label for="input2">Vacunado</label>
                  <div class="options">
                    <button *ngFor="let item of vaccine" class="option" [class.selected]="isSelected('vaccine', item)" (click)="selectOption('name', item, 'vaccine')">{{ item['name'] }}</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Esterelizado</label>
                  <div class="options">
                    <button *ngFor="let item of sterile" class="option" [class.selected]="isSelected('sterile', item)" (click)="selectOption('name', item, 'sterile')">{{ item['name'] }}</button>
                  </div>
                </div>
                <div class="input-group">
                  <label for="input2">Comportamiento</label>
                  <div class="options">
                    <button *ngFor="let item of behavior" class="option" [class.selected]="isSelected('behavior', item)" (click)="selectOption('name', item, 'behavior')">{{ item['name'] }}</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="input2">Estado Actual</label>
                  <div class="options">
                    <button *ngFor="let item of status" class="option" [class.selected]="isSelected('status', item)" (click)="selectOption('name', item, 'status')">{{ item['name'] }}</button>
                  </div>
                </div>
                <div class="input-group">
                  <label for="name">Responsable</label>
                  <div class="options">
                    <button *ngFor="let item of owner" class="option" [class.selected]="isSelected('owner', item)" (click)="selectOption('name', item, 'owner')">{{ item['name'] }}</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="item">
              <label for="name">Notas adicionales</label>
              <textarea type="text" id="breed" [value]="inputValue('notes')" (keyup)="keyup($event, 'notes')"></textarea>
            </div>
            <div class="item btn-container">
              <a class="btn" routerLink="/pets/create#propietario" (click)="setActiveLink('#propietario')">Siguiente</a>
            </div>
          </div>
          <div class="pet-item">
          </div>
        </div>
      </div>
      <div class="items" style="height: max-content; height: min-content;" id="propietario" *ngIf="isActive('#propietario')" [@fadeInOut]>
        <!-- Contenido de los items de propietario -->
        <h1>Propietario</h1>
        <div class="pet-information" >
          <div class="pet-item">
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Nombres</label>
                  <input type="text" id="name" required [value]="inputValue('ownerName')" (keyup)="keyup($event, 'name')">
                </div>
                <div class="input-group">
                  <label for="name">Apellidos</label>
                  <input type="text" id="lastname" required [value]="inputValue('ownerLastname')" (keyup)="keyup($event, 'name')">
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Documento unico de Identidad</label>
                  <input type="text" id="name" required [value]="inputValue('dui')" (keyup)="keyup($event, 'name')">
                </div>
                <div class="input-group">
                  <label for="department">Distrito</label>
                  <!-- <ng-select
                    [items]="departments"
                    bindLabel="name"
                    [virtualScroll]="true"
                    bindValue="id"
                    name="department"
                    [(ngModel)]="selectedValue"
                    style="width: 100%; background: #fff;">
                  </ng-select> -->
                  <select class="js-example-basic-single" name="state">
                    <option value="AL">Alabama</option>
                      ...
                    <option value="WY">Wyoming</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Distrito</label>
                  <select name="district" id="district">
                    <option value=""></option>
                  </select>
                </div>
                <div class="input-group">
                  <label for="name">Comunidad</label>
                  <input type="text" id="name" required [value]="inputValue('ownerLastname')" (keyup)="keyup($event, 'name')">
                </div>
              </div>
            </div>
            <div class="item">
              <div class="input-container">
                <div class="input-group">
                  <label for="name">Direccions</label>
                  <input type="text" id="name" required [value]="inputValue('ownerName')" (keyup)="keyup($event, 'name')">
                </div>
              </div>
            </div>
            <div class="item btn-container">
              <a class="btn" routerLink="/pets/create#propietario" (click)="setActiveLink('#propietario')">Siguiente</a>
            </div>
            <div class="item"></div>
          </div>
        </div>
      </div>
      <div class="items" id="contacto" *ngIf="isActive('#contacto')" [@fadeInOut]>
        <!-- Contenido de los items de contacto -->
        <h1>Contacto y otros datos</h1>
      </div>
    </form>
  </div>
</div>
